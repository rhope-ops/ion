name: release
# Automated Ion Release: verifies main ref and semver tag, runs scripts/check.sh, and creates GitHub Release + tag via gh.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff==0.17.6 pylint==4.1.4 shellcheck-py==0.9.0.6
      - name: Validate tag format
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "ERROR: tag '$INPUT_TAG' must match vX.Y.Z" >&2
            exit 1
          fi
      - name: Run full checks
        run: bash scripts/check.sh
      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$INPUT_TAG" --target "$GITHUB_SHA" --title "Ion $INPUT_TAG" --generate-notes
